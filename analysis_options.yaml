# Use Very Good Analysis as the base lint ruleset
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  # Exclude generated/build and tool directories
  exclude:
    - "**/*.g.dart"
    - "**/*.gr.dart"
    - "**/*.config.dart"
    - "**/*.mocks.dart"
    - "**/*.freezed.dart"
    - "lib/generated/**"
    - "lib/injection.config.dart"
    - "**/generated_plugin_registrant.dart"
    - "**/firebase_options.dart"
    - "build/**"
    - ".dart_tool/**"
    - ".idea/**"
    - ".vscode/**"
    - "ios/**"
    - "android/**"
    - "gen/**"

  # Stricter static analysis (type checks)
  language:
    strict-casts: true        # Catch implicit downcasts
    strict-inference: true    # Avoid dynamic fallback
    strict-raw-types: true    # Require type arguments on generics

  # Custom error severity overrides (only non-default changes)
  errors:
    # Elevate missing returns from warning to error
    missing_return: error

    # Keep package imports style (conflicts with always_use_package_imports)
    prefer_relative_imports: ignore

linter:
  rules:
    # Your selected rules (no duplicates)
    always_use_package_imports
    avoid_print
    avoid_function_literals_in_foreach_calls
    prefer_final_locals
    prefer_final_fields
    prefer_single_quotes
    prefer_const_declarations
    prefer_expression_function_bodies
    unnecessary_this
    unnecessary_underscores
    use_super_parameters
    use_null_aware_elements
    avoid_redundant_argument_values
    omit_local_variable_types
    sort_constructors_first
    sort_unnamed_constructors_first
    avoid_classes_with_only_static_members
    require_trailing_commas
    lines_longer_than_80_chars
    directives_ordering

coverage:
  ignore:
    - "**/*.g.dart"
    - "**/*.gr.dart"
    - "**/freezed.dart"
    - "**/config.dart"