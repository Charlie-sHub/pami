# Use Very Good Analysis as the base lint ruleset
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  # Exclude generated/build and tool directories
  exclude:
    - "**/*.g.dart"
    - "**/*.gr.dart"
    - "**/*.config.dart"
    - "**/*.mocks.dart"
    - "**/*.freezed.dart"
    - "lib/generated/**"
    - "lib/injection.config.dart"
    - "**/generated_plugin_registrant.dart"
    - "**/firebase_options.dart"
    - "build/**"
    - ".dart_tool/**"
    - ".idea/**"
    - ".vscode/**"
    - "ios/**"
    - "android/**"
    - "gen/**"

  # Stricter static analysis (type checks)
  language:
    strict-casts: true        # Catch implicit downcasts
    strict-inference: true    # Avoid dynamic fallback
    strict-raw-types: true    # Require type arguments on generics

  # Custom error severity overrides (only non-default changes)
  errors:
    # Elevate missing returns from warning to error
    missing_return: error

    # Keep package imports style (conflicts with always_use_package_imports)
    prefer_relative_imports: ignore
    one_member_abstracts: ignore

linter:
  rules:
    prefer_const_declarations: true
    always_use_package_imports: true
    avoid_print: true
    avoid_function_literals_in_foreach_calls: true
    prefer_final_locals: true
    prefer_final_fields: true
    prefer_single_quotes: true
    prefer_expression_function_bodies: true
    unnecessary_this: true
    unnecessary_underscores: true
    use_super_parameters: true
    use_null_aware_elements: true
    avoid_redundant_argument_values: true
    omit_local_variable_types: true
    sort_constructors_first: true
    sort_unnamed_constructors_first: true
    avoid_classes_with_only_static_members: true
    require_trailing_commas: true
    lines_longer_than_80_chars: true
    directives_ordering: true

coverage:
  ignore:
    - "**/*.g.dart"
    - "**/*.gr.dart"
    - "**/freezed.dart"
    - "**/config.dart"